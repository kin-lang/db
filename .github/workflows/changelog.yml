name: Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Update changelog') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Record commits that landed on main
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/update-changelog.ts
        env:
          CHANGELOG_FROM: ${{ github.event.before }}
          CHANGELOG_TO: ${{ github.sha }}

      - name: Push the changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update changelog"
          git push
